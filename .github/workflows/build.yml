name: build image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - presets/**
      - nodes/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/thepexcel/aiangelcomfypod

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUDA 13 needs a host driver that supports it; 12.8 stays for older hosts.
          # `latest` = cuda13.0: AiAngelH3 5 s clip on RTX PRO 6000 warm 31 s vs 75 s on 12.8 (2026-09-15).
          - cuda: "12.8"
            base: runpod/comfyui:1.3.0-rc.164-comfyuiv0.35.0-cuda12.8@sha256:f070f97750ed4a3abdcad5fa9491eb327addac5226b135d0c76910335e11b364
            latest: false
          - cuda: "13.0"
            base: runpod/comfyui:1.3.0-rc.164-comfyuiv0.35.0-cuda13.0@sha256:f5b1c6fc580486a95a1f68832c043d7b3d8a73d032cf3a83b2c55dececddb79d
            latest: true
    steps:
      - uses: actions/checkout@v4

      # The base image unpacks to well over the ~14 GB a hosted runner has free.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Shell syntax
        run: bash -n docker/start.sh && bash -n docker/download_models.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: |
            ${{ matrix.latest && format('{0}:latest', env.IMAGE) || '' }}
            ${{ env.IMAGE }}:cuda${{ matrix.cuda }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}-cuda${{ matrix.cuda }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ComfyUI for MiniMax H3 and SCAIL-2 video on RunPod (CUDA ${{ matrix.cuda }})
